org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true

# mobile_scanner: use the ML Kit barcode model shipped by Google Play Services
# instead of bundling it in the APK. Saves libbarhopper_v3.so (~4.7 MB per ABI)
# plus ~0.9 MB of .tflite assets. Play Services fetches the model on first scan,
# so the very first scan on a fresh install needs a network connection.
dev.steenbakker.mobile_scanner.useUnbundled=true
# Built-in Kotlin (AGP 9): plugins such as file_picker no longer apply KGP
# themselves and depend on AGP compiling their Kotlin sources.
android.builtInKotlin=true
# AGP 9 reads only the new DSL by default, which the Flutter Gradle plugin and
# most third-party plugins don't speak yet. Flutter's own template still opts
# out; revisit once the ecosystem has migrated.
android.newDsl=false
# Agora ships three prebuilt AARs that share the io.agora.rtc namespace
# (iris-rtc, agora-special-full, iris-rtm). AGP 9 turned duplicate library
# namespaces into a hard error; we can't patch vendor AARs, so keep the
# AGP 8 behaviour. Drop this if Agora ever republishes them with unique ones.
android.uniquePackageNames=false
